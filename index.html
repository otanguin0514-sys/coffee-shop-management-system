<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brew Haven Coffee Shop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f3ef;
      color: #3d251e;
    }

    header {
      background: #4b2e22;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    header span {
      color: #e8c39e;
    }

    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 25px;
      padding: 30px;
      max-width: 1400px;
      margin: auto;
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 24px;
    }

    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .category-button {
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      background: #ead8c8;
      color: #4b2e22;
    }

    .category-button.active,
    .category-button:hover {
      background: #a8653d;
      color: white;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      transition: 0.2s;
    }

    .product:hover {
      transform: translateY(-3px);
    }

    .product-icon {
      font-size: 45px;
      text-align: center;
      margin-bottom: 12px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .product p {
      color: #777;
      font-size: 14px;
      min-height: 35px;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }

    .price {
      font-weight: bold;
      color: #a8653d;
    }

    .add-button {
      border: none;
      background: #4b2e22;
      color: white;
      padding: 8px 13px;
      border-radius: 6px;
      cursor: pointer;
    }

    .add-button:hover {
      background: #a8653d;
    }

    .order-panel {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .order-items {
      margin: 20px 0;
      min-height: 100px;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 30px 0;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      gap: 10px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
    }

    .item-price {
      color: #777;
      font-size: 14px;
      margin-top: 4px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .quantity-controls button {
      border: none;
      background: #ead8c8;
      color: #4b2e22;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-button {
      border: none;
      background: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 16px;
    }

    .summary {
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
    }

    .summary-row.total {
      font-weight: bold;
      font-size: 20px;
      color: #4b2e22;
      border-top: 1px solid #ddd;
      padding-top: 13px;
    }

    .checkout-button {
      width: 100%;
      border: none;
      background: #a8653d;
      color: white;
      padding: 14px;
      border-radius: 7px;
      margin-top: 18px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .checkout-button:hover {
      background: #4b2e22;
    }

    .clear-button {
      width: 100%;
      border: 1px solid #c0392b;
      color: #c0392b;
      background: white;
      padding: 10px;
      border-radius: 7px;
      margin-top: 10px;
      cursor: pointer;
    }

    .clear-button:hover {
      background: #c0392b;
      color: white;
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
        padding: 18px;
      }

      .order-panel {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>☕ Brew <span>Haven</span></h1>
    <div>Point of Sale System</div>
  </header>

  <main class="container">
    <section>
      <h2 class="section-title">Our Menu</h2>

      <div class="categories">
        <button class="category-button active" onclick="filterProducts('All', this)">All</button>
        <button class="category-button" onclick="filterProducts('Coffee', this)">Coffee</button>
        <button class="category-button" onclick="filterProducts('Tea', this)">Tea</button>
        <button class="category-button" onclick="filterProducts('Pastry', this)">Pastry</button>
        <button class="category-button" onclick="filterProducts('Cold Drinks', this)">Cold Drinks</button>
      </div>

      <div class="menu" id="menu"></div>
    </section>

    <aside class="order-panel">
      <h2 class="section-title">Current Order</h2>

      <div class="order-items" id="orderItems">
        <div class="empty">No items added yet</div>
      </div>

      <div class="summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₱0.00</span>
        </div>

        <div class="summary-row">
          <span>Tax 8%</span>
          <span id="tax">₱0.00</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₱0.00</span>
        </div>
      </div>

      <button class="checkout-button" onclick="checkout()">Complete Payment</button>
      <button class="clear-button" onclick="clearOrder()">Clear Order</button>
    </aside>
  </main>

  <script>
    const products = [
      {
        id: 1,
        name: "Espresso",
        description: "Strong and rich single shot coffee",
        price: 95,
        category: "Coffee",
        icon: "☕"
      },
      {
        id: 2,
        name: "Cappuccino",
        description: "Espresso with steamed milk foam",
        price: 150,
        category: "Coffee",
        icon: "☕"
      },
      {
        id: 3,
        name: "Caffe Latte",
        description: "Smooth espresso with warm milk",
        price: 170,
        category: "Coffee",
        icon: "🥛"
      },
      {
        id: 4,
        name: "Americano",
        description: "Espresso with hot water",
        price: 120,
        category: "Coffee",
        icon: "☕"
      },
      {
        id: 5,
        name: "Green Tea",
        description: "Refreshing organic green tea",
        price: 110,
        category: "Tea",
        icon: "🍵"
      },
      {
        id: 6,
        name: "Chai Latte",
        description: "Spiced tea with steamed milk",
        price: 150,
        category: "Tea",
        icon: "🍵"
      },
      {
        id: 7,
        name: "Chocolate Muffin",
        description: "Fresh muffin with chocolate chips",
        price: 120,
        category: "Pastry",
        icon: "🧁"
      },
      {
        id: 8,
        name: "Croissant",
        description: "Buttery and freshly baked",
        price: 140,
        category: "Pastry",
        icon: "🥐"
      },
      {
        id: 9,
        name: "Blueberry Cake",
        description: "Soft cake with fresh blueberries",
        price: 180,
        category: "Pastry",
        icon: "🍰"
      },
      {
        id: 10,
        name: "Iced Coffee",
        description: "Cold coffee served over ice",
        price: 160,
        category: "Cold Drinks",
        icon: "🧊"
      },
      {
        id: 11,
        name: "Lemonade",
        description: "Fresh homemade lemonade",
        price: 120,
        category: "Cold Drinks",
        icon: "🍋"
      },
      {
        id: 12,
        name: "Iced Tea",
        description: "Refreshing cold brewed tea",
        price: 110,
        category: "Cold Drinks",
        icon: "🥤"
      }
    ];

    let order = [];

    function formatPeso(value) {
      return `₱${value.toFixed(2)}`;
    }

    function displayProducts(category = "All") {
      const menu = document.getElementById("menu");

      const filteredProducts = category === "All"
        ? products
        : products.filter(product => product.category === category);

      menu.innerHTML = filteredProducts.map(product => `
        <div class="product">
          <div class="product-icon">${product.icon}</div>
          <h3>${product.name}</h3>
          <p>${product.description}</p>

          <div class="product-bottom">
            <span class="price">${formatPeso(product.price)}</span>
            <button class="add-button" onclick="addToOrder(${product.id})">
              Add
            </button>
          </div>
        </div>
      `).join("");
    }

    function filterProducts(category, button) {
      document.querySelectorAll(".category-button").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
      displayProducts(category);
    }

    function addToOrder(productId) {
      const product = products.find(item => item.id === productId);
      const existingItem = order.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity++;
      } else {
        order.push({
          ...product,
          quantity: 1
        });
      }

      updateOrder();
    }

    function updateQuantity(productId, change) {
      const item = order.find(item => item.id === productId);

      if (!item) return;

      item.quantity += change;

      if (item.quantity <= 0) {
        order = order.filter(item => item.id !== productId);
      }

      updateOrder();
    }

    function removeFromOrder(productId) {
      order = order.filter(item => item.id !== productId);
      updateOrder();
    }

    function updateOrder() {
      const orderItems = document.getElementById("orderItems");

      if (order.length === 0) {
        orderItems.innerHTML = `<div class="empty">No items added yet</div>`;
      } else {
        orderItems.innerHTML = order.map(item => `
          <div class="order-item">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">
                ${formatPeso(item.price * item.quantity)}
              </div>
            </div>

            <div class="quantity-controls">
              <button onclick="updateQuantity(${item.id}, -1)">−</button>
              <span>${item.quantity}</span>
              <button onclick="updateQuantity(${item.id}, 1)">+</button>
            </div>

            <button class="remove-button" onclick="removeFromOrder(${item.id})">
              ✕
            </button>
          </div>
        `).join("");
      }

      const subtotal = order.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );

      const tax = subtotal * 0.08;
      const total = subtotal + tax;

      document.getElementById("subtotal").textContent = formatPeso(subtotal);
      document.getElementById("tax").textContent = formatPeso(tax);
      document.getElementById("total").textContent = formatPeso(total);
    }

    function clearOrder() {
      if (order.length === 0) return;

      if (confirm("Clear the current order?")) {
        order = [];
        updateOrder();
      }
    }

    function checkout() {
      if (order.length === 0) {
        alert("Please add at least one item to the order.");
        return;
      }

      const total = document.getElementById("total").textContent;

      alert(`Payment successful!\nTotal paid: ${total}\nThank you for visiting Brew Haven.`);

      order = [];
      updateOrder();
    }

    displayProducts();
    updateOrder();
  </script>
</body>
</html>
